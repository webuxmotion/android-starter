org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# `java` on PATH here is JDK 25, which Gradle 8.11 does not support (the build
# fails with a bare "What went wrong: 25.0.1"). Point Gradle at the JDK 17
# bundled with Android Studio instead. Machine-specific path — adjust if you
# clone this repo elsewhere.
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
